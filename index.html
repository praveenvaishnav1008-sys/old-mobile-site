<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Old Mobile Bazar</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <h1>Old Mobile Bazar 📱</h1>
    </header>
    <main>
        <div class="search-container">
            <input type="text" id="search-bar" placeholder="Search by model...">
        </div>
        <div class="add-mobile-container">
            <button id="add-mobile-btn">Add Your Mobile</button>
        </div>
        <table id="mobile-table">
            <thead>
                <tr>
                    <th>Model</th>
                    <th>Price</th>
                    <th>Condition</th>
                    <th>Contact</th>
                </tr>
            </thead>
            <tbody id="mobile-table-body">
                <!-- Mobile data will be inserted here by JavaScript -->
            </tbody>
        </table>
    </main>
    <script src="script.js"></script>
</body>
</html>
